        model: {

          FSupplierId: { FNumber: row.supNo, FName: row.supName },
          FPurchaseOrgId: { FNumber: "100", FName: "苏州工业园组织" },
          FDocumentStatus: row.status, FCreatorName: "Administrator", FEntity: [],
        },
        status: row.status, number: row.FBillNo,
      };
    });
  }
  seedDemoBills();

  function okResult(message, bid, number) {
    const entity = bid != null ? { Id: bid, Number: number } : {};
    return {
      Result: {
        ResponseStatus: { IsSuccess: true, Errors: [], Msg: message },
        SuccessEntitys: bid != null ? [entity] : [],
      },
    };
  }
  function failResult(message) {
    return {
      Result: {
        ResponseStatus: { IsSuccess: false, Errors: [{ Message: message }], Msg: message },
        SuccessEntitys: [],
      },
    };
  }
  function enrichNames(node) {
    if (Array.isArray(node)) { node.forEach(enrichNames); return; }
    if (node && typeof node === "object") {
      if ("FNumber" in node && !("FName" in node)) node.FName = "演示" + node.FNumber;
      Object.keys(node).forEach((k) => enrichNames(node[k]));
    }
  }
  function parseData(body) {
    const raw = body && body.data !== undefined ? body.data : "{}";
    if (raw && typeof raw === "object") return raw;
    try { const v = JSON.parse(raw); return v && typeof v === "object" ? v : {}; } catch (e) { return {}; }
  }
  function getField(model, path) {
    let node = model;
    const parts = String(path).split(".");
    for (let i = 0; i < parts.length; i++) {
      const part = parts[i];
      if (node && typeof node === "object" && part in node) { node = node[part]; continue; }
      if (i === 0 && model && typeof model === "object" && part in model) { node = model[part]; continue; }
      return "";
    }
    return node == null ? "" : node;
  }
  function resolveIds(body) {
    const data = parseData(body);
    const ids = data.Ids || [];
    return Array.isArray(ids) ? ids.map((i) => parseInt(i, 10)).filter((n) => !isNaN(n) && String(n).trim() !== "") : [];
  }
  function stateAction(body, target, actionName) {
    const formId = body && body.formid ? body.formid : "";
    const ids = resolveIds(body);
    const store = bills[formId] || {};
    const okIds = [], numbers = [];
    for (let i = 0; i < ids.length; i++) {
      const rec = store[ids[i]];
      if (rec === undefined) return failResult("单据 " + ids[i] + " 不存在");
      rec.status = target;
      okIds.push(ids[i]);
      numbers.push(rec.number);
    }
    return okResult(actionName + "成功", okIds.length ? okIds[0] : null, numbers.length ? numbers[0] : "");
  }
  const HANDLERS = {
    [SVC.VALIDATE]: (body) => {
      const b = body || {};
      if (b.username === MOCK_USER && b.password === MOCK_PASSWORD) return { LoginResultType: 1, Message: "登录成功" };
      return { LoginResultType: 0, Message: "用户名或密码错误" };
    },
    [SVC.SAVE]: (body) => {
      const b = body || {};
      const formId = b.formid || "";
      const data = parseData(b);
      const bid = nextId();
      const number = nextNo(formId);
      data.Id = bid;
      data.FBillNo = number;
      enrichNames(data);
      if (!bills[formId]) bills[formId] = {};
      bills[formId][bid] = { model: data, status: "A", number: number };
      return okResult("保存成功", bid, number);
    },
    [SVC.SUBMIT]: (body) => stateAction(body, "B", "提交"),
    [SVC.AUDIT]: (body) => stateAction(body, "C", "审核"),
    [SVC.UNAUDIT]: (body) => stateAction(body, "B", "反审核"),
    [SVC.DELETE]: (body) => {
      const b = body || {};
      const formId = b.formid || "";
      const ids = resolveIds(b);
      const store = bills[formId] || {};
      for (let i = 0; i < ids.length; i++) {
        const rec = store[ids[i]];
        if (rec === undefined) return failResult("单据 " + ids[i] + " 不存在");
        if (rec.status === "C") return failResult("单据 " + ids[i] + " 已审核，请先反审核再删除");
        delete store[ids[i]];
      }
      return okResult("删除成功");
    },
    [SVC.VIEW]: (body) => {
      const b = body || {};
      const formId = b.formid || "";
      const data = parseData(b);
      const bid = data.Id ? parseInt(data.Id, 10) : 0;
      const rec = (bills[formId] || {})[bid];
      if (rec === undefined) return failResult("单据 " + bid + " 不存在");
      return { Result: rec.model };
    },
    [SVC.QUERY]: (body) => {
      const data = parseData(body);
      const formId = data.FormId || "";
      const top = parseInt(data.TopRowCount || 0, 10) || 0;
      const fields = String(data.FieldKeys || "").split(",").map((s) => s.trim()).filter(Boolean);
      const store = bills[formId] || {};
      const rows = [];
      const keys = Object.keys(store).map((k) => parseInt(k, 10)).sort((a, b) => b - a);
      for (let i = 0; i < keys.length; i++) {
        const rec = store[keys[i]];
        const m = rec.model;
        const row = fields.map((f) => {
          let val = getField(m, f);
          if ((val === "" || val == null) && f === "FDocumentStatus" && rec.status) val = rec.status;
          return val;
        });
        rows.push(row);
        if (top && rows.length >= top) break;
      }
      return rows;
    },
    [SVC.PUSH]: (body) => {
      const b = body || {};
      const formId = b.formid || "";
      const data = parseData(b);
      const target = data.TargetFormId || TARGET_FORM;
      const bid = nextId();
      const number = nextNo(target);
      if (!bills[target]) bills[target] = {};
      bills[target][bid] = {
        model: { Id: bid, FBillNo: number, SourceFormId: formId },
        status: "A", number: number,
      };
      return okResult("下推成功", bid, number);
    },
    [RESET_SVC]: () => {
      bills = {};
      seedDemoBills();
      return { Message: "演示数据已重置" };
    },
  };
  async function call(service, body) {
    const handler = HANDLERS[service];
    if (!handler) return failResult("离线内存模拟未实现的端点：" + service);
    // 轻微延迟，使 loading 态可见并贴近真实往返节奏
    await new Promise((r) => setTimeout(r, 90 + Math.floor(Math.random() * 60)));
    return handler(body || {});
  }
  return { call };
})();

/* ============================================================
 * ⑤ 传输层：离线内存（默认，单文件自包含）/ 在线 HTTP（可选，打到 mock_server）
 *    在线模式连接失败时自动回退离线并给出可重试提示。
 * ============================================================ */
const transport = (() => {
  let mode = "offline";
  let fallback = false;
  let base = DEFAULT_ONLINE_BASE;
  let timeoutMs = 6000;
  const listeners = new Set();
  function notify() { listeners.forEach((fn) => fn()); }
  return {
    get mode() { return mode; },
    get fallback() { return fallback; },
    get base() { return base; },
    get timeoutMs() { return timeoutMs; },
    setBase(next) { const v = String(next || "").trim(); if (v) { base = v.replace(/\/+$/, ""); notify(); } },
    setMode(next) {
      const want = next === "live" ? "live" : "offline";
      if (want === mode) return;
      mode = want;
      if (mode === "offline") fallback = false;
      notify();
    },
    markFallback() { mode = "offline"; fallback = true; notify(); },
    clearFallback() { fallback = false; notify(); },
    subscribe(fn) { listeners.add(fn); return () => listeners.delete(fn); },
  };
})();

/* ============================================================
 * ⑥ 协议调用日志：记录每次 .kdsvc 调用的端点/请求体/响应体/耗时/来源/结果
 * ============================================================ */
const protoLog = (() => {
  const items = [];
  const listeners = new Set();
  let seq = 0;
  function notify() { listeners.forEach((fn) => fn()); }
  return {
    push(entry) {
      seq += 1;
      const rec = Object.assign({ key: seq, seq: seq }, entry);
      items.unshift(rec);
      if (items.length > 120) items.length = 120;
      notify();
    },
    clear() { items.length = 0; notify(); },
    snapshot() { return items.slice(); },
    subscribe(fn) { listeners.add(fn); return () => listeners.delete(fn); },
  };
})();

async function liveCall(service, body) {
  const controller = typeof AbortController !== "undefined" ? new AbortController() : null;
  const timer = controller ? setTimeout(() => controller.abort(), transport.timeoutMs) : null;
  try {
    const res = await fetch(transport.base + "/" + service, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(body || {}),
      signal: controller ? controller.signal : undefined,
    });
    const text = await res.text();
    let parsed = null;
    try { parsed = JSON.parse(text); } catch (e) { parsed = null; }
    if (parsed === null) {
      return { Result: { ResponseStatus: { IsSuccess: false, Errors: [{ Message: "响应不是合法 JSON" }], Msg: "响应不是合法 JSON" } }, __raw: text.slice(0, 400), __status: res.status };
    }
    if (!res.ok) {
      return { Result: { ResponseStatus: { IsSuccess: false, Errors: [{ Message: "HTTP " + res.status }], Msg: JSON.stringify(parsed).slice(0, 200) } }, __status: res.status };
    }
    return parsed;
  } finally {
    if (timer) clearTimeout(timer);
  }
}

function judgeResponse(service, response) {
  if (Array.isArray(response)) return { ok: true, message: response.length + " 行" };
  if (service === SVC.VALIDATE) {
    const ok = !!(response && response.LoginResultType === 1);
    return { ok: ok, message: (response && response.Message) || "" };
  }
  if (service === RESET_SVC) return { ok: true, message: (response && response.Message) || "已重置" };
  const rs = response && response.Result && response.Result.ResponseStatus;
  if (!rs) return { ok: false, message: "响应结构异常" };
  return { ok: !!rs.IsSuccess, message: rs.Msg || "" };
}

async function kdsvc(service, body) {
  const started = Date.now();
  const payload = body || {};
  let source = transport.mode;
  let response = null;
  let fallbackError = "";
  if (transport.mode === "live") {
    try {
      response = await liveCall(service, payload);
      source = "live";
    } catch (e) {
      fallbackError = String((e && e.message) || e);
      transport.markFallback();
      response = await offlineMock.call(service, payload);
      source = "offline(fallback)";
    }
  } else {
    response = await offlineMock.call(service, payload);
    source = "offline";
  }
  const judged = judgeResponse(service, response);
  protoLog.push({
    time: nowStamp(),
    source: source,
    action: shortAction(service),
    endpoint: service,
    formid: payload.formid || (payload.data && payload.data.FormId) || "—",
    request: clipText(payload, 1600),
    response: clipText(response, 2200),
    ms: Date.now() - started,
    ok: judged.ok,
    msg: fallbackError ? fallbackError + "（已回退离线）" : judged.message,
  });
  return response;
}

/* ============================================================
 * ⑦ 表单查询字段（与页面表格列对应）
 * ============================================================ */
const FORM_QUERY = {
  PUR_PurchaseOrder: {
    FieldKeys: "Id,FBillNo,FDate,FSupplierId.FNumber,FSupplierId.FName,FPurchaseOrgId.FNumber,FPurchaseOrgId.FName,FDocumentStatus,FCreatorName",
    Columns: ["Id", "FBillNo", "FDate", "FSupplierId.FNumber", "FSupplierId.FName", "FPurchaseOrgId.FNumber", "FPurchaseOrgId.FName", "FDocumentStatus", "FCreatorName"],
  },
  SKY_ExpReimburse: {
    FieldKeys: "Id,FBillNo,FStaffId.FNumber,FStaffId.FName,FDepartmentId.FNumber,FDepartmentId.FName,FTravelDate,FReason,FAmount,FDocumentStatus,FCreatorName",
    Columns: ["Id", "FBillNo", "FStaffId.FNumber", "FStaffId.FName", "FDepartmentId.FNumber", "FDepartmentId.FName", "FTravelDate", "FReason", "FAmount", "FDocumentStatus", "FCreatorName"],
  },
  STK_InStock: {
    FieldKeys: "Id,FBillNo,SourceFormId,FDocumentStatus",
    Columns: ["Id", "FBillNo", "SourceFormId", "FDocumentStatus"],
  },
};

function setDotted(model, path, value) {
  const parts = String(path).split(".");
  let node = model;
  for (let i = 0; i < parts.length - 1; i++) {
    const p = parts[i];
    if (!node[p] || typeof node[p] !== "object") node[p] = {};
    node = node[p];
  }
  node[parts[parts.length - 1]] = value;
  return model;
}

const store = (() => {
  let bills = {};
  const listeners = new Set();
  function notify() { listeners.forEach((fn) => fn(bills)); }
  function snapshot() { return JSON.parse(JSON.stringify(bills)); }
  function subscribe(fn) { listeners.add(fn); return () => listeners.delete(fn); }
  async function reload(formId) {
    const cfg = FORM_QUERY[formId];
    if (!cfg) return { ok: false, error: "未定义的查询表单：" + formId };
    const rows = await kdsvc(SVC.QUERY, {
      formid: formId,
      data: JSON.stringify({ FormId: formId, FieldKeys: cfg.FieldKeys, TopRowCount: 100 }),
    });
    if (!Array.isArray(rows)) {
      const rs = rows && rows.Result && rows.Result.ResponseStatus;
      return { ok: false, error: (rs && (rs.Msg || (rs.Errors && rs.Errors[0] && rs.Errors[0].Message))) || "查询失败" };
    }
    const next = {};
    rows.forEach((row) => {
      const model = {};
      cfg.Columns.forEach((col, i) => setDotted(model, col, row[i]));
      const id = model.Id;
      if (id == null || id === "") return;
      next[id] = { model: model, status: model.FDocumentStatus || "A", number: model.FBillNo || ("#" + id) };
    });
    bills[formId] = next;
    notify();
    return { ok: true, error: "" };
  }
  async function reloadAll() {
    const out = {};
    const keys = Object.keys(FORM_QUERY);
    for (let i = 0; i < keys.length; i++) out[keys[i]] = await reload(keys[i]);
    return out;
  }
  async function call(service, body) {
    const formId = (body && body.formid) || "";
    const response = await kdsvc(service, body);
    if (formId && FORM_QUERY[formId] && service !== SVC.VALIDATE) {
      await reload(formId);
      if (service === SVC.PUSH) await reload(TARGET_FORM);
    }
    return { endpoint: service, response: response };
  }
  async function resetDemo() {
    const res = await kdsvc(RESET_SVC, {});
    await reloadAll();
    return res;
  }
  function clear() { bills = {}; notify(); }
  return { snapshot, subscribe, reload, reloadAll, call, resetDemo, clear };
})();

/* ============================================================
 * ⑧ 部署自检（模拟 --selfcheck 文本 / JSON 输出）
 * ============================================================ */
function buildSelfcheck(opts) {
  const allowInsecureHttp = opts.allowInsecureHttp;
  const secretSource = opts.secretSource;
  const online = opts.mode === "live";
  const probe = opts.probe || null;
  let connectivity;
  if (online) {
    connectivity = probe
      ? { pass: !!probe.ok, detail: probe.detail + "（探测于 " + probe.at + "）" }
      : { pass: false, detail: "尚未探测：请点击『探测服务连通性』确认 " + transport.base + " 可达" };
  } else {
    connectivity = { pass: true, detail: "离线内存模拟：内置 ValidateUser 与动态表单端点，无需外部服务" };
  }
  const checks = [
    { name: "配置文件可解析", pass: true, detail: "App.config 存在且 XML 合法" },
    { name: "WebAPI 服务地址已配置", pass: true, detail: online ? transport.base + "（在线 mock_server）" : "离线演示模式：使用内置端点" },
    { name: "账号信息完整", pass: true, detail: "UserName/Password 或 AppID/AppSec 已配置" },
    { name: "密钥源(" + secretSource + ")可用", pass: true, detail: "密钥读取与解密正常" },
    { name: "传输安全策略（强制 HTTPS）", pass: !allowInsecureHttp, detail: allowInsecureHttp ? "AllowInsecureHttp=true，明文 HTTP 放行，存在降级风险" : "AllowInsecureHttp=false，仅允许 HTTPS" },
    { name: "模拟服务连通性", pass: connectivity.pass, detail: connectivity.detail },
  ];
  const ready = checks.every((c) => c.pass);
  return { ready: ready, exitCode: ready ? 0 : 1, checks: checks };
}
function selfcheckText(sc) {
  const lines = [];
  lines.push("KingdeeSky.WebApiClient SelfCheck");
  lines.push("--------------------------------");
  sc.checks.forEach((c) => {
    lines.push((c.pass ? "[PASS]" : "[FAIL]") + " " + c.name + " - " + c.detail);
  });
  lines.push("--------------------------------");
  lines.push("自检" + (sc.ready ? "通过" : "未通过") + "，ExitCode=" + sc.exitCode);
  return lines.join("\n");
}
function selfcheckJson(sc) {
  return JSON.stringify(
    {
      ok: sc.ready,
      exitCode: sc.exitCode,
      checks: sc.checks.map((c) => ({ name: c.name, pass: c.pass, detail: c.detail })),
    },
    null,
    2
  );
}

/* ============================================================

function StatusTag({ status }) {
  const map = { A: ["default", "草稿"], B: ["processing", "已提交"], C: ["success", "已审核"] };
  const pair = map[status] || ["default", status];
  return <Tag color={pair[0]}>{pair[1]}</Tag>;
}

function SourceTag({ source }) {
  const color = source === "live" ? "blue" : source === "offline" ? "default" : "orange";
  return <Tag color={color}>{SOURCE_LABEL[source] || source}</Tag>;
}

function useDataMode() {
  const [, force] = useState(0);
  useEffect(() => transport.subscribe(() => force((v) => v + 1)), []);
  return { mode: transport.mode, fallback: transport.fallback, base: transport.base };
}

function useProtoLog() {
  const [, force] = useState(0);
  useEffect(() => protoLog.subscribe(() => force((v) => v + 1)), []);
  return protoLog.snapshot();
}

        用于验证「操作台动作 == 一次真实 WebApiClient 协议调用」。

          <Input
            data-od-id="data-source-base"
            size="small"
            style={{ marginTop: 6 }}
            defaultValue={base}
            onChange={(e) => transport.setBase(e.target.value)}

          />

        <Space>
          <Button size="small" icon={<SyncOutlined />} loading={testing} onClick={testConnection}>测试连接</Button>
          {probe && <Text type={probe.ok ? "success" : "danger"} style={{ fontSize: 12 }}>{probe.detail}</Text>}
        </Space>
        {fallback && <Alert type="warning" showIcon message="在线连接失败，已自动回退离线内存模拟" />}
        <Text type="secondary" style={{ fontSize: 12 }}>

  );

  return (
    <Popover content={content} trigger="click" placement="bottomRight">
      <Button data-od-id="data-source-btn" icon={<DatabaseOutlined />}>{SOURCE_LABEL[mode] || mode}</Button>
    </Popover>

function SelfcheckPage({ appState, setAppState }) {
  const { message: msg } = KitApp.useApp();
  const { mode } = useDataMode();
  const [outputMode, setOutputMode] = useState("text");
  const [running, setRunning] = useState(false);
  const [checked, setChecked] = useState(false);
  const [secretSource, setSecretSource] = useState("env");
  const [probe, setProbe] = useState(null);
  const [probing, setProbing] = useState(false);

  function compute() {
    return buildSelfcheck({
      allowInsecureHttp: appState.allowInsecureHttp,
      secretSource: secretSource,
      mode: transport.mode,
      probe: probe,
    });
  }
  function runSelfcheck() {
    setRunning(true);
    setTimeout(() => {
      const result = compute();
      setAppState({ selfcheckReady: result.ready, selfcheckOutput: result });
      setChecked(true);
      setRunning(false);
    }, 400);
  }
  async function probeConnectivity() {
    setProbing(true);
    const wasOffline = transport.mode === "offline";
    const res = await kdsvc(SVC.VALIDATE, { acctID: "DEMO", username: MOCK_USER, password: MOCK_PASSWORD, lcid: 2052 });
    const ok = !!(res && res.LoginResultType === 1);
    const detail = wasOffline
      ? "离线内存模拟：本地实现 ValidateUser，未发起网络请求"
      : "HTTP " + transport.base + " → LoginResultType=" + (res ? res.LoginResultType : "无响应");
    setProbe({ ok: ok, detail: detail, at: nowStamp() });
    setProbing(false);
    msg[ok ? "success" : "error"](ok ? "连通性探测通过" : "连通性探测失败，请检查服务地址");
  }
  const sc = compute();
  const textOutput = checked ? (outputMode === "text" ? selfcheckText(sc) : selfcheckJson(sc)) : "（请点击『运行部署自检』）";
  return (
    <div style={{ maxWidth: 1000 }}>
      <Paragraph type="secondary" style={{ marginBottom: 16 }}>
        模拟客户端 <Text code>KingdeeSky.WebApiClient.exe --selfcheck [--json]</Text> 的行为：逐项检查配置、密钥来源、
        传输安全与服务连通性，退出码 0=就绪 / 1=未就绪。当前数据来源：<SourceTag source={mode} />。
      </Paragraph>
      <Card className="app-section">
        <div className="app-toolbar">
          <Select
            value={secretSource}
            style={{ width: 200 }}
            options={[
              { value: "env", label: "密钥来源：env（环境变量）" },
              { value: "file", label: "密钥来源：file（配置文件）" },
              { value: "dpapi", label: "密钥来源：dpapi（DPAPI 保护）" },
              { value: "kms", label: "密钥来源：kms（KMS）" },
            ]}
            onChange={setSecretSource}
          />
          <Button icon={<CheckCircleOutlined />} type="primary" loading={running} onClick={runSelfcheck}>运行部署自检</Button>
          <Button icon={<ApiOutlined />} loading={probing} onClick={probeConnectivity}>探测服务连通性</Button>
          <Segmented
            value={outputMode}
            onChange={setOutputMode}
            options={[
              { value: "text", label: "文本输出" },
              { value: "json", label: "JSON 输出" },
            ]}
          />
          {checked && (
            <Tag color={sc.exitCode === 0 ? "success" : "error"}>
              {sc.ready ? "自检通过" : "自检未通过"} · ExitCode={sc.exitCode}
            </Tag>
          )}
        </div>
        {checked && sc.exitCode !== 0 && (
          <Alert
            type="warning"
            showIcon
            style={{ marginBottom: 12 }}
            message="部署未就绪"
            description="存在失败检查项，请按输出修正后再启动客户端。演示中传输安全策略为显式放行明文 HTTP 时自检不通过；恢复『强制 HTTPS』即通过。"
          />
        )}
        <pre className="app-code">{textOutput}</pre>
      </Card>
      <Card title="检查项说明" size="small">
        <Space direction="vertical" size={4}>
          <Text className="app-hint">· <Text strong>传输安全</Text>：出厂默认应关闭 AllowInsecureHttp（强制 HTTPS）；显式放行仅为演示降级场景。</Text>
          <Text className="app-hint">· <Text strong>密钥来源</Text>：env / file / dpapi / kms 四选一，切换后自检结果随来源刷新。</Text>
          <Text className="app-hint">· <Text strong>服务连通性</Text>：离线模式由内置数据层作答；在线模式需先「探测服务连通性」确认 mock_server 可达。</Text>
          <Text className="app-hint">· <Text strong>退出码</Text>：0=就绪可启动，1=未就绪（本操作台为单文件演示，离线数据层与 mock_server 行为一致）。</Text>
        </Space>
      </Card>
    </div>
  );
}

function AuthPage({ appState, setAppState }) {

  const [error, setError] = useState("");
  const { message: msg } = KitApp.useApp();

  async function doLogin() {
    setLoading(true);
    setResult(null);
    setError("");
    let login = null;
    try {
      if (mode === "password") {
        login = await kdsvc(SVC.VALIDATE, { acctID: "DEMO", username: username, password: password, lcid: 2052 });
      } else {
        const ok = String(appId).trim() !== "" && String(appSec).trim().length >= 6;
        login = ok
          ? { LoginResultType: 1, Message: "AppID+AppSec 认证成功（骨架，未联调真实 OpenAPI）" }
          : { LoginResultType: 0, Message: "AppID 或 AppSec 错误" };

      setError(String((e && e.message) || e));
      setLoading(false);
      return;
    }
    const isSuccess = !!(login && login.LoginResultType === 1);
    const endpoint = mode === "password" ? SVC.VALIDATE : "OpenAPI.AuthByAppSecret";

          <Select
            value={secretSource}
            style={{ width: 220 }}
            options={[
              { value: "env", label: "密钥来源：env（环境变量）" },
              { value: "file", label: "密钥来源：file（配置文件）" },
              { value: "dpapi", label: "密钥来源：dpapi（DPAPI 保护）" },
              { value: "kms", label: "密钥来源：kms（KMS）" },
            ]}
            onChange={setSecretSource}
          />
        </div>
        <Space direction="vertical" style={{ width: "100%", maxWidth: 480 }} size={12}>
          {mode === "password" ? (

              </div>
              <div>
                <Text strong>密码</Text>
                <Input.Password value={password} onChange={(e) => setPassword(e.target.value)} placeholder="demo123" prefix={<LockOutlined />} style={{ marginTop: 4 }} />
              </div>
              <Text type="secondary">模拟账号：Administrator / demo123（与 mock_server.py 一致）</Text>
            </React.Fragment>
          ) : (
            <React.Fragment>
              <div>
                <Text strong>AppID</Text>
                <Input value={appId} onChange={(e) => setAppId(e.target.value)} placeholder="应用标识" prefix={<CloudServerOutlined />} style={{ marginTop: 4 }} />

 * ⑬ 采购订单：查询 / 筛选 / 批量 / 建单 / 查看(View) / 下推(Push)

function PurchasePage({ appState, onState }) {
  const { message: msg } = KitApp.useApp();
  const [tick, setTick] = useState(0);
  const [loading, setLoading] = useState(false);
  const [error, setError] = useState("");
  const [statusFilter, setStatusFilter] = useState("all");
  const [keyword, setKeyword] = useState("");
  const [selected, setSelected] = useState([]);
  const [busy, setBusy] = useState(false);
  const [detail, setDetail] = useState({ open: false, loading: false, id: null, number: "", model: null, error: "" });
  const [pushResult, setPushResult] = useState(null);
  const [createOpen, setCreateOpen] = useState(false);
  const [form] = Form.useForm();

  useEffect(() => {
    store.reload("PUR_PurchaseOrder");
    store.reload(TARGET_FORM);
    const un = store.subscribe(() => setTick((v) => v + 1));
    return un;
  }, []);

  const bills = useMemo(() => store.snapshot(), [tick]);
  const allOrders = Object.keys((bills.PUR_PurchaseOrder || {}))
    .map((bid) => Object.assign({ key: Number(bid) }, bills.PUR_PurchaseOrder[bid]))
    .sort((a, b) => b.model.Id - a.model.Id);
  const downstream = Object.keys((bills.STK_InStock || {}))
    .map((bid) => Object.assign({ key: Number(bid) }, bills.STK_InStock[bid]))
    .sort((a, b) => b.model.Id - a.model.Id);
  const kw = keyword.trim().toLowerCase();
  const orders = allOrders.filter((o) => {
    if (statusFilter !== "all" && o.status !== statusFilter) return false;
    if (!kw) return true;
    const sup = (o.model.FSupplierId && o.model.FSupplierId.FName) || "";
    const supNo = (o.model.FSupplierId && o.model.FSupplierId.FNumber) || "";
    const org = (o.model.FPurchaseOrgId && o.model.FPurchaseOrgId.FName) || "";
    return (o.number + " " + sup + " " + supNo + " " + org).toLowerCase().indexOf(kw) >= 0;
  });

  async function refresh() {
    setLoading(true);
    const res = await store.reload("PUR_PurchaseOrder");
    if (TARGET_FORM) await store.reload(TARGET_FORM);
    setLoading(false);
    setError(res.ok ? "" : res.error);
    if (res.ok) msg.success("已刷新查询（ExecuteBillQuery）");
    else msg.error("查询失败：" + res.error);
  }
  async function runFlow(action) {
    const service = SERVICE_BY_ACTION[action.action] || SVC.UNAUDIT;
    const res = await store.call(service, { formid: "PUR_PurchaseOrder", data: JSON.stringify({ Ids: [action.id] }) });
    const rs = res.response && res.response.Result && res.response.Result.ResponseStatus;
    const ok = !!(rs && rs.IsSuccess);
    msg[ok ? "success" : "error"]((rs && rs.Msg) || "操作失败");
  }
  async function runBatch(action) {
    if (!selected.length) { msg.warning("请先勾选单据"); return; }
    const rows = allOrders.filter((o) => selected.indexOf(o.key) >= 0);
    const service = action === "submit" ? SVC.SUBMIT : action === "audit" ? SVC.AUDIT : action === "unaudit" ? SVC.UNAUDIT : SVC.DELETE;
    const eligible = rows.filter((o) => (action === "submit" ? o.status === "A" : action === "audit" ? o.status === "B" : action === "unaudit" ? o.status === "C" : o.status !== "C"));
    if (!eligible.length) { msg.warning("所选单据中没有可" + (action === "submit" ? "提交" : action === "audit" ? "审核" : action === "unaudit" ? "反审核" : "删除") + "的记录"); return; }
    setBusy(true);
    const res = await store.call(service, { formid: "PUR_PurchaseOrder", data: JSON.stringify({ Ids: eligible.map((o) => o.key) }) });
    const rs = res.response && res.response.Result && res.response.Result.ResponseStatus;
    const ok = !!(rs && rs.IsSuccess);
    setBusy(false);
    if (ok) setSelected([]);
    msg[ok ? "success" : "error"]((rs && rs.Msg) || "操作失败");
  }
  async function doPush(row) {
    const res = await store.call(SVC.PUSH, {
      formid: "PUR_PurchaseOrder",
      data: JSON.stringify({ Ids: [row.key], TargetFormId: TARGET_FORM, RuleId: "" }),
    });
    const rs = res.response && res.response.Result && res.response.Result.ResponseStatus;
    const ok = !!(rs && rs.IsSuccess);
    const entity = ok && res.response.Result.SuccessEntitys && res.response.Result.SuccessEntitys[0] ? res.response.Result.SuccessEntitys[0] : null;
    setPushResult({ ok: ok, msg: (rs && rs.Msg) || "下推失败", sourceNo: row.number, id: entity ? entity.Id : "—", number: entity ? entity.Number : "—" });
  }
  async function openDetail(row) {
    setDetail({ open: true, loading: true, id: row.key, number: row.number, model: null, error: "" });
    const res = await store.call(SVC.VIEW, { formid: "PUR_PurchaseOrder", data: JSON.stringify({ Id: row.key }) });
    const model = res.response && res.response.Result;
    if (model && model.Id != null) setDetail({ open: true, loading: false, id: row.key, number: model.FBillNo || row.number, model: model, error: "" });
    else setDetail({ open: true, loading: false, id: row.key, number: row.number, model: null, error: "未获取到单据详情（View）" });
  }
  async function doCreate(values) {
    const res = await store.call(SVC.SAVE, {
      formid: "PUR_PurchaseOrder",
      data: JSON.stringify({
        FSupplierId: { FNumber: values.supplier },
        FPurchaseOrgId: { FNumber: "100", FName: "苏州工业园组织" },
        FDate: values.fdate,
        FCreatorName: appState.user || "Administrator",
        FEntity: [{ FMaterialId: { FNumber: values.material }, FQty: values.qty, FPrice: values.price }],
      }),
    });
    const rs = res.response && res.response.Result && res.response.Result.ResponseStatus;
    const ok = !!(rs && rs.IsSuccess);
    const entity = ok && res.response.Result.SuccessEntitys && res.response.Result.SuccessEntitys[0] ? res.response.Result.SuccessEntitys[0] : null;
    msg[ok ? "success" : "error"](((rs && rs.Msg) || "保存失败") + (ok && entity ? "：" + entity.Number : ""));
    if (ok) { setCreateOpen(false); form.resetFields(); onState({ purchaseFlowDone: true }); setError(""); }
  }

  const columns = [
    { title: "单号", dataIndex: "number", key: "number" },
    { title: "日期", dataIndex: ["model", "FDate"], key: "fdate" },
    { title: "供应商", dataIndex: ["model", "FSupplierId", "FName"], key: "supplier" },
    { title: "采购组织", dataIndex: ["model", "FPurchaseOrgId", "FName"], key: "org" },
    { title: "创建人", dataIndex: ["model", "FCreatorName"], key: "creator" },
    { title: "状态", dataIndex: "status", key: "status", render: (v) => <StatusTag status={v} /> },
    { title: "凭证", dataIndex: "id", key: "fid", render: (_, row) => <Text type="secondary" style={{ fontSize: 12 }}>Id={row.key}</Text> },
    {
      title: "操作",
      key: "action",
      width: 300,
      render: (_, row) => (
        <Space size={4} wrap>
          <Button size="small" data-od-id="purchase-view" icon={<EyeOutlined />} onClick={() => openDetail(row)}>查看</Button>
          {row.status === "A" && <Button size="small" data-od-id="purchase-submit" type="primary" icon={<SendOutlined />} onClick={() => runFlow({ action: "submit", id: row.key })}>提交</Button>}
          {row.status === "B" && <Button size="small" data-od-id="purchase-audit" type="primary" ghost icon={<AuditOutlined />} onClick={() => runFlow({ action: "audit", id: row.key })}>审核</Button>}
          {row.status === "C" && <Button size="small" data-od-id="purchase-unaudit" icon={<ReloadOutlined />} onClick={() => runFlow({ action: "unaudit", id: row.key })}>反审核</Button>}
          {row.status === "C" && <Button size="small" data-od-id="purchase-push" icon={<ThunderboltOutlined />} onClick={() => doPush(row)}>下推</Button>}
          {row.status !== "C" && (
            <Popconfirm title={"删除单据 " + row.number + "？"} okText="删除" cancelText="取消" onConfirm={() => runFlow({ action: "delete", id: row.key })}>
              <Button size="small" danger data-od-id="purchase-delete" icon={<ExclamationCircleOutlined />}>删除</Button>
            </Popconfirm>
          )}
        </Space>
      ),
    },
  ];
  const downColumns = [
    { title: "下游单号", dataIndex: "number", key: "number" },
    { title: "来源单据", dataIndex: ["model", "SourceFormId"], key: "src" },
    { title: "状态", dataIndex: "status", key: "status", render: (v) => <StatusTag status={v} /> },
    { title: "内码", key: "id", render: (_, row) => <Text type="secondary" style={{ fontSize: 12 }}>{row.key}</Text> },
  ];
  return (
    <div style={{ maxWidth: 1200 }}>
      <Paragraph type="secondary" style={{ marginBottom: 16 }}>
        演示金蝶云·星空采购订单 WebAPI 全流程：查询（ExecuteBillQuery）、新建草稿（Save）、提交（Submit）、审核（Audit）、
        查看（View）、反审核（UnAudit）、删除（Delete）、下推（Push → {TARGET_FORM}）。离线数据层与本机 mock_server.py 行为一致。
      </Paragraph>
      {error ? (
        <Alert
          type="error"
          showIcon
          style={{ marginBottom: 12 }}
          message="查询失败"
          description={error}
          action={<Button size="small" icon={<ReloadOutlined />} onClick={refresh}>重试</Button>}
        />
      ) : null}
      <Card className="app-section">
        <div className="app-toolbar">
          <Space size={8} align="center">
            <FilterOutlined style={{ color: "rgba(0,0,0,0.45)" }} />
            <Segmented
              value={statusFilter}
              onChange={setStatusFilter}
              options={[{ value: "all", label: "全部" }, { value: "A", label: "草稿" }, { value: "B", label: "已提交" }, { value: "C", label: "已审核" }]}
            />
          </Space>
          <Input
            data-od-id="purchase-search"
            allowClear
            style={{ width: 240 }}
            value={keyword}
            onChange={(e) => setKeyword(e.target.value)}
            placeholder="搜索单号 / 供应商 / 采购组织"
            prefix={<SearchOutlined style={{ color: "rgba(0,0,0,0.45)" }} />}
          />
          <Button icon={<ReloadOutlined />} loading={loading} onClick={refresh}>刷新查询（Top 10）</Button>
          <Button type="primary" icon={<PlusOutlined />} onClick={() => setCreateOpen(true)}>新建草稿</Button>
        </div>
        <div className="app-toolbar">
          <Text type="secondary" className="app-hint">已选 {selected.length} / {orders.length} 张</Text>
          <Button size="small" data-od-id="purchase-batch-submit" loading={busy} disabled={!selected.length} icon={<SendOutlined />} onClick={() => runBatch("submit")}>批量提交</Button>
          <Button size="small" data-od-id="purchase-batch-audit" loading={busy} disabled={!selected.length} icon={<AuditOutlined />} onClick={() => runBatch("audit")}>批量审核</Button>
          <Button size="small" data-od-id="purchase-batch-unaudit" loading={busy} disabled={!selected.length} icon={<ReloadOutlined />} onClick={() => runBatch("unaudit")}>批量反审核</Button>
          <Button size="small" danger data-od-id="purchase-batch-delete" loading={busy} disabled={!selected.length} icon={<DeleteOutlined />} onClick={() => runBatch("delete")}>批量删除</Button>
        </div>
        <p className="sr-only">采购订单列表：可勾选批量操作，每行提供查看、提交、审核、反审核、下推、删除操作。</p>
        <Table
          rowKey="key"
          loading={loading}
          columns={columns}
          dataSource={orders}
          rowSelection={{ selectedRowKeys: selected, onChange: (keys) => setSelected(keys) }}
          pagination={{ pageSize: 10, showTotal: (t) => "共 " + t + " 张" }}
          size="middle"
          scroll={{ x: 1000 }}
          locale={{ emptyText: <Empty image={Empty.PRESENTED_IMAGE_SIMPLE} description={allOrders.length ? "没有符合筛选条件的单据" : "暂无采购订单，可新建草稿或重置演示数据"} /> }}
        />
        <div style={{ marginTop: 8 }}>
          <Space split={<Divider type="vertical" />} wrap>
            <Text type="secondary" className="app-hint">A=草稿</Text>
            <Text type="secondary" className="app-hint">B=已提交</Text>
            <Text type="secondary" className="app-hint">C=已审核</Text>
            <Text type="secondary" className="app-hint">已审核单据需先反审核才能删除，下推仅对已审核单据开放</Text>
          </Space>
        </div>
      </Card>
      <Card title={"下推生成的下游单据（" + TARGET_FORM + "）"} className="app-section" size="small">
        {downstream.length === 0 ? (
          <Empty image={Empty.PRESENTED_IMAGE_SIMPLE} description="暂无下游单据：对已审核采购订单点击「下推」即可生成" />
        ) : (
          <Table rowKey="key" columns={downColumns} dataSource={downstream} pagination={false} size="small" scroll={{ x: 520 }} />
        )}
      </Card>
      <Modal
        title="新建采购订单草稿"
        open={createOpen}
        onOk={() => form.submit()}
        onCancel={() => setCreateOpen(false)}
        okText="保存"
        cancelText="取消"
        destroyOnClose
      >
        <Paragraph type="secondary" style={{ marginBottom: 8 }}>
          保存时模拟星空行为：强制写入内码（Id），单号按 SKY{"{"}formId去下划线{"}"}流水 生成，基础资料（供应商名称）自动带出。
        </Paragraph>
        <Form form={form} layout="vertical" onFinish={doCreate} initialValues={{ supplier: "VEN001", fdate: "2026-10-23", material: "M001", qty: 10, price: 88.5 }}>
          <Form.Item name="supplier" label="供应商（基础资料）" rules={[{ required: true, message: "请选择供应商" }]}>
            <Select options={[
              { value: "VEN001", label: "VEN001 上海示例供应商" },
              { value: "VEN002", label: "VEN002 北京示例供应商" },
              { value: "VEN003", label: "VEN003 广州示例供应商" },
            ]} />
          </Form.Item>
          <Form.Item name="fdate" label="单据日期" rules={[{ required: true }]}>
            <Input placeholder="2026-10-23" />
          </Form.Item>
          <Form.Item name="material" label="物料编码" rules={[{ required: true }]}>
            <Input placeholder="M001" />
          </Form.Item>
          <Form.Item name="qty" label="数量" rules={[{ required: true }]}>
            <InputNumber style={{ width: "100%" }} min={1} />
          </Form.Item>
          <Form.Item name="price" label="单价" rules={[{ required: true }]}>
            <InputNumber style={{ width: "100%" }} min={0} />
          </Form.Item>
        </Form>
      </Modal>
      <Modal
        title="下推结果（Push）"
        open={!!pushResult}
        footer={<Button onClick={() => setPushResult(null)}>关闭</Button>}
        onCancel={() => setPushResult(null)}
      >
        {pushResult ? (
          pushResult.ok ? (
            <Space direction="vertical" size={8} style={{ width: "100%" }}>
              <Alert type="success" showIcon message="下推成功" description={pushResult.msg + "：源单据 " + pushResult.sourceNo + " → 目标单据 " + TARGET_FORM} />
              <Descriptions column={1} size="small" bordered>
                <Descriptions.Item label="源单据">{pushResult.sourceNo}（PUR_PurchaseOrder）</Descriptions.Item>
                <Descriptions.Item label="目标单据">{TARGET_FORM}</Descriptions.Item>
                <Descriptions.Item label="下游内码">{pushResult.id}</Descriptions.Item>
                <Descriptions.Item label="下游单号">{pushResult.number}</Descriptions.Item>
              </Descriptions>
            </Space>
          ) : <Alert type="error" showIcon message="下推失败" description={pushResult.msg} />
        ) : null}
      </Modal>
      <Drawer
        title={detail.number ? "单据详情：" + detail.number : "单据详情"}
        open={detail.open}
        onClose={() => setDetail(Object.assign({}, detail, { open: false }))}
        width={480}
      >
        {detail.loading ? <Spin /> : detail.error ? (
          <Alert type="error" showIcon message="查看失败" description={detail.error} />
        ) : detail.model ? (
          <Descriptions column={1} bordered size="small">
            <Descriptions.Item label="内码 Id">{detail.model.Id}</Descriptions.Item>
            <Descriptions.Item label="单号">{detail.model.FBillNo}</Descriptions.Item>
            <Descriptions.Item label="日期">{detail.model.FDate}</Descriptions.Item>
            <Descriptions.Item label="供应商">{[detail.model.FSupplierId ? detail.model.FSupplierId.FNumber : "", detail.model.FSupplierId ? detail.model.FSupplierId.FName : ""].filter(Boolean).join(" ") || "—"}</Descriptions.Item>
            <Descriptions.Item label="采购组织">{detail.model.FPurchaseOrgId ? detail.model.FPurchaseOrgId.FName : "—"}</Descriptions.Item>
            <Descriptions.Item label="创建人">{detail.model.FCreatorName || "—"}</Descriptions.Item>
            <Descriptions.Item label="状态"><StatusTag status={detail.model.FDocumentStatus} /></Descriptions.Item>
            <Descriptions.Item label="分录">
              {(detail.model.FEntity || []).length ? detail.model.FEntity.map((e, i) => (
                <div key={i}>{e.FMaterialId ? e.FMaterialId.FNumber + " × " + e.FQty + " @ " + e.FPrice : "（空分录）"}</div>
              )) : "（无分录，可在演示中仅保存主档）"}
            </Descriptions.Item>
          </Descriptions>
        ) : null}
        <div style={{ marginTop: 12 }}>
          <Text type="secondary" className="app-hint">来源端点：View.common.kdsvc（详见「协议调用日志」）</Text>
        </div>
      </Drawer>
    </div>
  );
}

/* ============================================================
 * ⑭ 自定义单据（差旅费报销单 SKY_ExpReimburse）
 * ============================================================ */
function CustomDocPage({ appState }) {
  const { message: msg } = KitApp.useApp();
  const [tick, setTick] = useState(0);
  const [form] = Form.useForm();
  const [statusFilter, setStatusFilter] = useState("all");
  const [keyword, setKeyword] = useState("");
  const [busy, setBusy] = useState(false);
  const [error, setError] = useState("");
  const [detail, setDetail] = useState({ open: false, loading: false, model: null, error: "", number: "" });
  useEffect(() => {
    store.reload("SKY_ExpReimburse");
    const un = store.subscribe(() => setTick((v) => v + 1));
    return un;
  }, []);
  const bills = useMemo(() => store.snapshot(), [tick]);
  const allDocs = Object.keys((bills.SKY_ExpReimburse || {}))
    .map((bid) => Object.assign({ key: Number(bid) }, bills.SKY_ExpReimburse[bid]))
    .sort((a, b) => b.model.Id - a.model.Id);
  const kw = keyword.trim().toLowerCase();
  const docs = allDocs.filter((d) => {
    if (statusFilter !== "all" && d.status !== statusFilter) return false;
    if (!kw) return true;
    const staff = (d.model.FStaffId && d.model.FStaffId.FName) || "";
    const staffNo = (d.model.FStaffId && d.model.FStaffId.FNumber) || "";
    const dept = (d.model.FDepartmentId && d.model.FDepartmentId.FName) || "";
    const reason = d.model.FReason || "";
    return (d.number + " " + staff + " " + staffNo + " " + dept + " " + reason).toLowerCase().indexOf(kw) >= 0;
  });

  async function saveDoc(values, alsoSubmit) {
    setBusy(true);
    setError("");
    const saved = await store.call(SVC.SAVE, {
      formid: "SKY_ExpReimburse",
      data: JSON.stringify({
        FStaffId: { FNumber: values.staffNo },
        FDepartmentId: { FNumber: values.deptNo },
        FTravelDate: values.travelDate,
        FReason: values.reason,
        FAmount: values.amount,
        FCreatorName: appState.user || "Administrator",
      }),
    });
    const srs = saved.response && saved.response.Result && saved.response.Result.ResponseStatus;
    const ok = !!(srs && srs.IsSuccess);
    if (!ok) {
      setBusy(false);
      const reason = (srs && srs.Msg) || "保存失败";
      setError(reason);
      msg.error(reason);
      return;
    }
    const entity = saved.response.Result.SuccessEntitys && saved.response.Result.SuccessEntitys[0] ? saved.response.Result.SuccessEntitys[0] : null;
    let tail = "：" + (entity ? entity.Number : "");
    if (alsoSubmit && entity) {
      const sub = await store.call(SVC.SUBMIT, { formid: "SKY_ExpReimburse", data: JSON.stringify({ Ids: [entity.Id] }) });
      const brs = sub.response && sub.response.Result && sub.response.Result.ResponseStatus;
      tail += " → " + ((brs && brs.Msg) || "提交失败");
    }
    setBusy(false);
    msg.success((srs.Msg || "保存成功") + tail);
    form.resetFields();
  }
  async function docFlow(action, row) {
    const service = SERVICE_BY_ACTION[action];
    const res = await store.call(service, { formid: "SKY_ExpReimburse", data: JSON.stringify({ Ids: [row.key] }) });
    const rs = res.response && res.response.Result && res.response.Result.ResponseStatus;
    const ok = !!(rs && rs.IsSuccess);
    msg[ok ? "success" : "error"]((rs && rs.Msg) || "操作失败");
  }
  async function openDetail(row) {
    setDetail({ open: true, loading: true, model: null, error: "", number: row.number });
    const res = await store.call(SVC.VIEW, { formid: "SKY_ExpReimburse", data: JSON.stringify({ Id: row.key }) });
    const model = res.response && res.response.Result;
    if (model && model.Id != null) setDetail({ open: true, loading: false, model: model, error: "", number: model.FBillNo || row.number });
    else setDetail({ open: true, loading: false, model: null, error: "未获取到单据详情（View）", number: row.number });
  }
  const columns = [
    { title: "单号", dataIndex: "number", key: "number" },
    { title: "申请人", dataIndex: ["model", "FStaffId", "FName"], key: "staff" },
    { title: "部门", dataIndex: ["model", "FDepartmentId", "FName"], key: "dept" },
    { title: "出差日期", dataIndex: ["model", "FTravelDate"], key: "date" },
    { title: "事由", dataIndex: ["model", "FReason"], key: "reason", ellipsis: true },
    { title: "报销金额", dataIndex: ["model", "FAmount"], key: "amount", render: (v) => "¥" + Number(v || 0).toFixed(2) },
    { title: "状态", dataIndex: "status", key: "status", render: (v) => <StatusTag status={v} /> },
    {
      title: "操作",
      key: "action",
      width: 280,
      render: (_, row) => (
        <Space size={4} wrap>
          <Button size="small" icon={<EyeOutlined />} onClick={() => openDetail(row)}>查看</Button>
          {row.status === "A" && <Button size="small" type="primary" icon={<SendOutlined />} onClick={() => docFlow("submit", row)}>提交</Button>}
          {row.status === "B" && <Button size="small" type="primary" ghost icon={<AuditOutlined />} onClick={() => docFlow("audit", row)}>审核</Button>}
          {row.status === "C" && <Button size="small" icon={<ReloadOutlined />} onClick={() => docFlow("unaudit", row)}>反审核</Button>}
          {row.status !== "C" && (
            <Popconfirm title={"删除单据 " + row.number + "？"} okText="删除" cancelText="取消" onConfirm={() => docFlow("delete", row)}>
              <Button size="small" danger icon={<ExclamationCircleOutlined />}>删除</Button>
            </Popconfirm>
          )}
        </Space>
      ),
    },
  ];
  return (
    <div style={{ maxWidth: 1200 }}>
      <Paragraph type="secondary" style={{ marginBottom: 16 }}>
        演示在二开插件定义的自定义单据（formId：SKY_ExpReimburse）上调用 Save / Submit / Audit / View：
        保存后自动生成 SKYExpReimburse 单号并补齐基础资料名称；「保存并提交」为真实的 Save → Submit 两步调用。
      </Paragraph>
      {error ? <Alert type="error" showIcon style={{ marginBottom: 12 }} message="保存失败" description={error} /> : null}
      <div style={{ display: "flex", gap: 16, flexWrap: "wrap" }}>
        <Card title="差旅费报销单（SKY_ExpReimburse）" style={{ flex: "1 1 420px", maxWidth: 560 }}>
          <Form form={form} layout="vertical" onFinish={(v) => saveDoc(v, false)} initialValues={{ staffNo: "E1001", deptNo: "D01", travelDate: "2026-10-22", reason: "上海-苏州客户拜访差旅", amount: 1280.5 }}>
            <Form.Item name="staffNo" label="员工编码" rules={[{ required: true }]}><Input placeholder="E1001" /></Form.Item>
            <Form.Item name="deptNo" label="部门编码" rules={[{ required: true }]}><Input placeholder="D01" /></Form.Item>
            <Form.Item name="travelDate" label="出差日期" rules={[{ required: true }]}><Input placeholder="2026-10-22" /></Form.Item>
            <Form.Item name="reason" label="报销事由" rules={[{ required: true }]}><Input.TextArea rows={2} /></Form.Item>
            <Form.Item name="amount" label="报销金额（元）" rules={[{ required: true }]}><InputNumber style={{ width: "100%" }} min={0} prefix="¥" /></Form.Item>
            <Form.Item>
              <Space wrap>
                <Button type="primary" htmlType="submit" loading={busy} icon={<FileAddOutlined />}>保存（Save）</Button>
                <Button type="primary" ghost loading={busy} icon={<SendOutlined />} onClick={() => form.validateFields().then((v) => saveDoc(v, true)).catch(() => msg.warning("请先补全表单必填项"))}>保存并提交</Button>
              </Space>
            </Form.Item>
          </Form>
        </Card>
        <Card
          title="已创建的自定义单据"
          style={{ flex: "1 1 480px", minWidth: 320 }}
          extra={<Segmented size="small" value={statusFilter} onChange={setStatusFilter} options={[{ value: "all", label: "全部" }, { value: "A", label: "草稿" }, { value: "B", label: "已提交" }, { value: "C", label: "已审核" }]} />}
        >
          <div className="app-toolbar">
            <Text type="secondary" className="app-hint">共 {docs.length} / {allDocs.length} 张</Text>
            <Input
              data-od-id="customdoc-search"
              allowClear
              style={{ width: 240 }}
              value={keyword}
              onChange={(e) => setKeyword(e.target.value)}
              placeholder="搜索单号 / 申请人 / 部门 / 事由"
              prefix={<SearchOutlined style={{ color: "rgba(0,0,0,0.45)" }} />}
            />
          </div>
          <p className="sr-only">自定义单据列表：包含单号、申请人、部门、出差日期、事由、报销金额、状态与操作。</p>
          <Table
            rowKey="key"
            columns={columns}
            dataSource={docs}
            pagination={false}
            size="middle"
            scroll={{ x: 860 }}
            locale={{ emptyText: <Empty image={Empty.PRESENTED_IMAGE_SIMPLE} description={allDocs.length ? "没有符合筛选条件的单据" : "尚未创建单据，填写左侧表单保存即可"} /> }}
          />
        </Card>
      </div>
      <Drawer
        title={detail.number ? "单据详情：" + detail.number : "单据详情"}
        open={detail.open}
        onClose={() => setDetail(Object.assign({}, detail, { open: false }))}
        width={460}
      >
        {detail.loading ? <Spin /> : detail.error ? (
          <Alert type="error" showIcon message="查看失败" description={detail.error} />
        ) : detail.model ? (
          <Descriptions column={1} bordered size="small">
            <Descriptions.Item label="内码 Id">{detail.model.Id}</Descriptions.Item>
            <Descriptions.Item label="单号">{detail.model.FBillNo}</Descriptions.Item>
            <Descriptions.Item label="申请人">{[detail.model.FStaffId ? detail.model.FStaffId.FNumber : "", detail.model.FStaffId ? detail.model.FStaffId.FName : ""].filter(Boolean).join(" ") || "—"}</Descriptions.Item>
            <Descriptions.Item label="部门">{[detail.model.FDepartmentId ? detail.model.FDepartmentId.FNumber : "", detail.model.FDepartmentId ? detail.model.FDepartmentId.FName : ""].filter(Boolean).join(" ") || "—"}</Descriptions.Item>
            <Descriptions.Item label="出差日期">{detail.model.FTravelDate || "—"}</Descriptions.Item>
            <Descriptions.Item label="报销事由">{detail.model.FReason || "—"}</Descriptions.Item>
            <Descriptions.Item label="报销金额">{"¥" + Number(detail.model.FAmount || 0).toFixed(2)}</Descriptions.Item>
            <Descriptions.Item label="状态"><StatusTag status={detail.model.FDocumentStatus} /></Descriptions.Item>
          </Descriptions>
        ) : null}
      </Drawer>
    </div>
  );
}

/* ============================================================
 * ⑮ 传输安全策略
 * ============================================================ */
function SecurityPage({ appState, setAppState }) {
  const { message: msg } = KitApp.useApp();
  const { mode } = useDataMode();
  const [logs, setLogs] = useState([]);
  const [testing, setTesting] = useState(false);
  const allow = appState.allowInsecureHttp;

  function toggleAllow(v) {
    setAppState({ allowInsecureHttp: v });
    msg[v ? "warning" : "success"](v ? "已显式放行明文 HTTP（演示降级场景）" : "已恢复强制 HTTPS");
  }
  function runProbe(protocol) {
    setTesting(true);
    setTimeout(() => {
      const isHttps = protocol === "https";
      const blocked = !isHttps && !allow;
      setLogs((prev) => [
        {
          key: prev.length + 1,
          time: new Date().toLocaleTimeString("zh-CN", { hour12: false }),
          endpoint: protocol + "://gateway" + (isHttps ? "" : ":8080") + "/K3Cloud/Kingdee.BOS.WebApi.ServicesStub.DynamicFormService.ExecuteBillQuery.common.kdsvc",
          protocol: isHttps ? "HTTPS" : "HTTP",
          strategy: allow ? "显式放行（警告）" : "默认拦截",
          result: blocked ? "已拦截" : "已放行",
        },
        ...prev,
      ].slice(0, 50));
      setTesting(false);
      msg[blocked ? "error" : "info"](isHttps ? "HTTPS 请求正常放行" : blocked ? "明文 HTTP 已被默认策略拦截" : "明文 HTTP 已放行（告警）");
    }, 300);
  }
  const columns = [
    { title: "时间", dataIndex: "time", key: "time", width: 110 },
    { title: "请求端点", dataIndex: "endpoint", key: "endpoint", ellipsis: true },
    { title: "协议", dataIndex: "protocol", key: "protocol", width: 90, render: (v) => <Tag color={v === "HTTPS" ? "green" : "orange"}>{v}</Tag> },
    { title: "策略", dataIndex: "strategy", key: "strategy", width: 150 },
    { title: "结果", dataIndex: "result", key: "result", width: 100, render: (v) => <Tag color={v === "已放行" ? "green" : "red"}>{v}</Tag> },
  ];
  return (
    <div style={{ maxWidth: 1100 }}>
      <Paragraph type="secondary" style={{ marginBottom: 16 }}>
        模拟客户端的传输安全策略：<Text strong>默认强制 HTTPS</Text>，仅当显式放行时允许明文 HTTP，且放行会触发告警；
        该策略同时影响部署自检结果与下方请求日志。当前数据来源：<SourceTag source={mode} />。
      </Paragraph>
      <Card className="app-section">
        <div className="app-toolbar">
          <Space size={12} align="center">
            <Text strong>AllowInsecureHttp</Text>
            <Switch data-od-id="security-allow-switch" checked={allow} checkedChildren="放行 HTTP" unCheckedChildren="强制 HTTPS" onChange={toggleAllow} />
            <Tag color={allow ? "warning" : "success"}>{allow ? "明文 HTTP 已放行" : "强制 HTTPS"}</Tag>
          </Space>
          <Button type="primary" icon={<SafetyOutlined />} loading={testing} onClick={() => runProbe("https")}>探测 HTTPS</Button>
          <Button danger icon={<UnlockOutlined />} loading={testing} onClick={() => runProbe("http")}>探测 HTTP</Button>
        </div>
        {allow ? (
          <Alert
            type="warning"
            showIcon
            style={{ marginBottom: 12 }}
            message="当前已显式放行明文 HTTP"
            description="演示降级场景：生产环境务必保持 AllowInsecureHttp=false，强制 HTTPS 传输，避免账号与业务数据明文暴露。"
          />
        ) : (
          <Alert
            type="success"
            showIcon
            style={{ marginBottom: 12 }}
            message="当前为强制 HTTPS"
            description="传输安全默认策略正确；明文 HTTP 将被阻断并记录到下方请求日志。"
          />
        )}
        <p className="sr-only">传输安全探测日志：包含时间、请求端点、协议、策略与结果。</p>
        <Table
          rowKey="key"
          columns={columns}
          dataSource={logs}
          pagination={false}
          size="middle"
          scroll={{ x: 760 }}
          locale={{ emptyText: <Empty image={Empty.PRESENTED_IMAGE_SIMPLE} description="尚未发起探测，点击上方按钮生成请求日志" /> }}
        />
        <Paragraph type="secondary" className="app-hint" style={{ marginTop: 8, marginBottom: 0 }}>
          说明：本页探测为客户端传输策略的<Text strong>行为模拟</Text>，不发起真实网络请求；真实网络调用记录见顶栏「协议调用日志」。
        </Paragraph>
      </Card>
    </div>
  );
}

function Shell() {
  const route = useHashRoute();
  const [themeMode, setThemeMode] = useState("light");
  const [navCollapsed, setNavCollapsed] = useState(false);
  const [appState, setAppState] = useState({
    selfcheckReady: false,
    selfcheckOutput: null,
    loggedIn: false,
    user: "",
    allowInsecureHttp: false,
    purchaseFlowDone: false,
  });
  const [dataTick, setDataTick] = useState(0);
  const [logOpen, setLogOpen] = useState(false);
  const [queryError, setQueryError] = useState("");
  const mode = useDataMode();
  const logCount = useProtoLog().length;

  useEffect(() => {
    store.reloadAll();
    const un = store.subscribe(() => setDataTick((v) => v + 1));
    return un;
  }, []);
  useEffect(() => {
    let last = transport.mode;
    return transport.subscribe(() => {
      if (transport.mode !== last) {
        last = transport.mode;
        store.reloadAll().then((out) => {
          const firstFail = Object.keys(out).map((k) => out[k]).filter((r) => r && !r.ok)[0];
          setQueryError(firstFail ? firstFail.error : "");
        });
      }
    });
  }, []);
  useEffect(() => {
    if (typeof window.matchMedia !== "function") return undefined;
    const mq = window.matchMedia("(max-width: 900px)");
    const apply = () => setNavCollapsed(mq.matches);
    apply();
    if (mq.addEventListener) mq.addEventListener("change", apply);
    else if (mq.addListener) mq.addListener(apply);
    return () => {
      if (mq.removeEventListener) mq.removeEventListener("change", apply);
      else if (mq.removeListener) mq.removeListener(apply);
    };
  }, []);
  // 便于校验工具读取运行态（只读，不改变行为）
  window.__transport = () => ({ mode: transport.mode, fallback: transport.fallback, base: transport.base });
  window.__protoLog = () => protoLog.snapshot();

  function patchApp(patch) { setAppState((prev) => Object.assign({}, prev, patch)); }
  function onNavigate(path) { location.hash = path; }
  async function onResetDemo() {
    const res = await store.resetDemo();
    setQueryError("");
    if (res && res.Message) return true;
    return true;
  }
  const pages = {
    "/overview": <OverviewPage onNavigate={onNavigate} appState={appState} bills={store.snapshot()} lastError={queryError} />,
    "/selfcheck": <SelfcheckPage appState={appState} setAppState={patchApp} />,
    "/auth": <AuthPage appState={appState} setAppState={patchApp} />,
    "/purchase": <PurchasePage appState={appState} onState={patchApp} />,
    "/custom-doc": <CustomDocPage appState={appState} />,
    "/security": <SecurityPage appState={appState} setAppState={patchApp} />,
  };
  const Page = pages[route] || pages["/overview"];
  const routeMeta = ROUTES[route] || ROUTES["/overview"];
  return (
    <ConfigProvider locale={zhCN} themeMode={themeMode}>
      <KitApp>
        <div data-dumate-shell="foundation-cloud" style={{ display: "flex", flexDirection: "column", height: "100vh", overflow: "hidden" }}>
          <GlobalHeader />
          <div style={{ display: "flex", flex: 1, overflow: "hidden" }}>
            <SideNav route={route} collapsed={navCollapsed} onToggle={() => setNavCollapsed((v) => !v)} />
            <main className="app-main">
              <div className="page-header">
                <div>
                  <h1 className="page-h1">{routeMeta.name}</h1>
                  <Text type="secondary" className="page-sub">{PAGE_SUB[route] || ""}</Text>
                </div>
                <div className="ph-controls">
                  <DataSourceButton />
                  <Badge count={logCount} size="small" offset={[-2, 2]}>
                    <Button data-od-id="proto-log-open" icon={<ApiOutlined />} onClick={() => setLogOpen(true)}>协议调用日志</Button>
                  </Badge>
                  <Popconfirm title="重置演示数据为初始 3 张采购订单？" okText="重置" cancelText="取消" onConfirm={async () => { await onResetDemo(); patchApp({ purchaseFlowDone: false }); }}>
                    <Button data-od-id="reset-demo" icon={<ReloadOutlined />}>重置演示数据</Button>
                  </Popconfirm>
                  <Space size={6} align="center">
                    <BulbOutlined style={{ color: "rgba(0,0,0,0.45)" }} />
                    <Switch
                      data-od-id="theme-switch"
                      checked={themeMode === "dark"}
                      checkedChildren="暗色"
                      unCheckedChildren="亮色"
                      onChange={(v) => setThemeMode(v ? "dark" : "light")}
                    />
                  </Space>
                </div>
              </div>
              {mode.fallback ? (
                <Alert
                  type="warning"
                  showIcon
                  style={{ marginBottom: 16 }}
                  message="在线服务不可达，已自动回退离线内存模拟"
                  description={transport.base + " 连接失败；可点击「数据源」重新测试连接，或继续使用离线数据层演示。"}
                  action={<Button size="small" icon={<SyncOutlined />} onClick={() => { transport.clearFallback(); transport.setMode("live"); }}>重试在线</Button>}
                />
              ) : null}
              <Spin spinning={false} />
              {Page}
            </main>
          </div>
          <ProtocolLogDrawer open={logOpen} onClose={() => setLogOpen(false)} />
        </div>
      </KitApp>
    </ConfigProvider>
  );
}

createRoot(document.getElementById("root")).render(<Shell />);
</script>
